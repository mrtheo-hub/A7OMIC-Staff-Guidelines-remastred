<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login: A7OMIC</title>
<link rel="icon" type="image/png" href="a7omic-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060a; --navy: #0a2540; --navy-mid: #123a5e; --teal: #2dd4bf;
    --mint: #95e9d6; --mint-pale: #ddf6f1; --white: #eafdf9; --muted: #6f8b96;
    --border: rgba(45,212,191,0.2); --card-bg: rgba(8,20,34,0.7);
    --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    --ease: cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--white); font-family: var(--font-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 20% 15%, rgba(18,58,94,0.5) 0%, transparent 55%),
                radial-gradient(circle at 85% 85%, rgba(149,233,214,0.14) 0%, transparent 55%);
  }
  .card {
    position: relative; z-index: 1; max-width: 380px; width: 100%; text-align: center;
    border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg);
    backdrop-filter: blur(20px); padding: 44px 32px; animation: fadeUp 0.6s var(--ease) both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  @keyframes shake { 20%,60%{transform:translateX(-4px)} 40%,80%{transform:translateX(4px)} }
  .logo-box {
    width: 56px; height: 56px; border-radius: 14px; overflow: hidden; margin: 0 auto 20px;
    border: 1px solid var(--border);
  }
  .logo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--mint); margin-bottom: 10px;
  }
  h1 {
    font-family: var(--font-display); font-size: 26px; font-weight: 800; margin-bottom: 10px;
    letter-spacing: -0.02em;
  }
  p.sub { font-size: 13.5px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
  .error {
    display: none; font-size: 12.5px; color: #fb923c; background: rgba(251,146,60,0.08);
    border: 1px solid rgba(251,146,60,0.3); border-radius: 10px; padding: 10px 14px;
    margin-bottom: 20px; line-height: 1.5;
  }
  .discord-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    padding: 13px 20px; border-radius: 12px; border: 1px solid var(--teal);
    background: rgba(45,212,191,0.12); color: var(--white); font-family: var(--font-body);
    font-size: 14.5px; font-weight: 500; text-decoration: none; cursor: pointer;
    transition: all 0.25s var(--ease);
  }
  .discord-btn:hover { background: rgba(45,212,191,0.22); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(45,212,191,0.2); }
  .discord-btn.locked { opacity: 0.4; pointer-events: none; transform: none; box-shadow: none; }
  .discord-btn svg { flex-shrink: 0; }
  .footnote { margin-top: 20px; font-size: 11px; color: rgba(111,139,150,0.7); }
  .agree-row { display: flex; align-items: flex-start; gap: 10px; text-align: left; margin-bottom: 18px; padding: 2px 2px; cursor: pointer; }
  .agree-row input { position: absolute; opacity: 0; width: 18px; height: 18px; margin: 0; cursor: pointer; }
  .agree-box {
    flex-shrink: 0; width: 18px; height: 18px; margin-top: 1px; border-radius: 5px;
    border: 1px solid var(--border); background: rgba(8,20,34,0.6);
    display: flex; align-items: center; justify-content: center; transition: all 0.2s var(--ease);
  }
  .agree-row input:checked ~ .agree-box { background: var(--teal); border-color: var(--teal); }
  .agree-box svg { width: 11px; height: 11px; opacity: 0; transform: scale(0.6); transition: all 0.15s var(--ease); color: #04060a; }
  .agree-row input:checked ~ .agree-box svg { opacity: 1; transform: scale(1); }
  .agree-text { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .agree-text a { color: var(--mint-pale); text-decoration: underline; text-underline-offset: 2px; }
  .agree-text a:hover { color: var(--mint); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-box"><img src="a7omic-logo.png" alt="A7OMIC"></div>
    <div class="eyebrow">Restricted Access</div>
    <h1>Staff Login</h1>
    <p class="sub">This is the A7OMIC staff guidelines portal. Sign in with the Discord account tied to your staff role to continue.</p>
    <div class="error" id="errorBox"></div>
    <label class="agree-row">
      <input type="checkbox" id="agreeCheck">
      <span class="agree-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg></span>
      <span class="agree-text">I agree to the <a href="terms">Terms of Service</a> and <a href="privacy">Privacy Policy</a>.</span>
    </label>
    <a class="discord-btn locked" id="discordBtn" href="#">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127c-.598.35-1.22.645-1.873.893a.076.076 0 0 0-.041.106c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
      Continue with Discord
    </a>
    <div class="footnote">Access is limited to accounts holding the staff role in the A7OMIC server.</div>
  </div>

<script>
  // --- fill these in once you've registered the Discord application ---
  const DISCORD_CLIENT_ID = '1541451751956160542';
  const REDIRECT_URI = window.location.origin + '/api/callback';
  // ----------------------------------------------------------------------

  function randomState() {
    const arr = new Uint8Array(16);
    crypto.getRandomValues(arr);
    return Array.from(arr, (b) => b.toString(16).padStart(2, '0')).join('');
  }
  const state = randomState();
  document.cookie = `oauth_state=${state}; Path=/; Max-Age=600; SameSite=Lax; Secure`;

  const authorizeUrl = 'https://discord.com/oauth2/authorize?' + new URLSearchParams({
    client_id: DISCORD_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'code',
    scope: 'identify guilds guilds.members.read',
    prompt: 'consent',
    state: state,
  }).toString();
  const discordBtn = document.getElementById('discordBtn');
  discordBtn.href = authorizeUrl;

  const agreeCheck = document.getElementById('agreeCheck');
  agreeCheck.addEventListener('change', () => {
    discordBtn.classList.toggle('locked', !agreeCheck.checked);
  });
  discordBtn.addEventListener('click', (e) => {
    if (!agreeCheck.checked) {
      e.preventDefault();
      agreeCheck.closest('.agree-row').style.animation = 'none';
      void agreeCheck.offsetWidth;
      agreeCheck.closest('.agree-row').style.animation = 'shake 0.3s';
    }
  });

  const errors = {
    not_staff: "That Discord account doesn't have the staff role yet. Ask an admin if you think this is wrong.",
    not_member: "That Discord account isn't a member of the A7OMIC server.",
    token_exchange: 'Discord login failed to complete. Please try again.',
    missing_code: 'Login was cancelled or interrupted. Please try again.',
    state_mismatch: 'Login session expired or looked tampered with. Please try again.',
  };
  const err = new URLSearchParams(window.location.search).get('error');
  if (err && errors[err]) {
    const box = document.getElementById('errorBox');
    box.textContent = errors[err];
    box.style.display = 'block';
  }
</script>
</body>
</html>
